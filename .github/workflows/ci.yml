name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the wheel
        shell: pwsh
        run: |
          python -m pip install build pytest jsonschema
          python -m build --wheel
          $wheel = (Get-ChildItem dist/eos_generation-*.whl).FullName
          python -m pip install "$wheel[notebook]"
      - name: Verify installed imports and passive planning outside the checkout
        shell: pwsh
        run: |
          $outside = Join-Path $env:RUNNER_TEMP passive-installed
          New-Item -ItemType Directory -Path $outside | Out-Null
          Set-Location $outside
          @'
          import json, os, subprocess
          from pathlib import Path
          import eos_generation
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(eos_generation.__file__).resolve().is_relative_to(root)
          assert (Path(eos_generation.__file__).parent / 'source_manifest.json').is_file()
          result = subprocess.run(['bsk24-trial','plan','--config',str(root/'configs/quickstart.json'),'--json'],check=True,capture_output=True,text=True)
          plan = json.loads(result.stdout)
          assert plan['scientific_solver_calls'] == plan['filesystem_writes'] == 0
          assert list(Path.cwd().iterdir()) == []
          refused = subprocess.run(['bsk24-trial','run','--config',str(root/'configs/quickstart.json'),'--execute'],capture_output=True,text=True)
          assert refused.returncode != 0 and '--plan-hash' in refused.stderr
          assert list(Path.cwd().iterdir()) == []
          '@ | python -
      - name: Run regression, notebook and hygiene checks against the installed wheel
        shell: pwsh
        run: |
          $outside = Join-Path $env:RUNNER_TEMP installed-tests
          New-Item -ItemType Directory -Path $outside | Out-Null
          Set-Location $outside
          python -m pytest -q "$env:GITHUB_WORKSPACE/tests"
      - name: Exercise the Git-free source archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/source-archive"
          mkdir -p "$archive"
          git archive HEAD | tar -x -C "$archive"
          cd "$RUNNER_TEMP"
          python -m pytest -q "$archive/tests/test_repository.py"
      - name: Confirm tracked files and non-ignored files are unchanged
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $changes = git status --porcelain=v1 --untracked-files=all
          if ($changes) { throw ($changes -join "`n") }
