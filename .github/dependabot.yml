version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Governed scientific pins change only through deliberate review.
    # Security-update pull requests remain enabled separately by GitHub.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
