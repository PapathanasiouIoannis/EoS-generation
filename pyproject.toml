[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "eos-generation"
version = "1.0.0"
description = "Reproducible BSk24 sound-speed deformations and neutron-star calculations"
readme = "README.md"
license = "MIT"
authors = [
  {name = "Ioannis Papathanasiou"},
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.2",
  "matplotlib==3.9.2",
  "numba==0.60.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab",
  "ipykernel",
  "nbformat",
  "nbclient",
]

[project.scripts]
bsk24-trial = "eos_generation.cli:main"

[project.urls]
Repository = "https://github.com/PapathanasiouIoannis/EoS-generation"
Documentation = "https://github.com/PapathanasiouIoannis/EoS-generation/tree/main/docs"
Issues = "https://github.com/PapathanasiouIoannis/EoS-generation/issues"
Changelog = "https://github.com/PapathanasiouIoannis/EoS-generation/blob/main/CHANGELOG.md"
Security = "https://github.com/PapathanasiouIoannis/EoS-generation/security/policy"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["eos_generation*"]
namespaces = false

[tool.setuptools.package-data]
"eos_generation.bsk24" = ["source_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
